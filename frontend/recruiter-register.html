<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Registration - HireFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">HireFlow</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="jobs.html">Jobs</a>
        <a href="applications.html">Applications</a>
        <a href="register.html">Candidate Register</a>
    </div>
        <a href="login.html">Login</a>
</nav>

<section class="register-section">

    <div class="register-container">

        <h1>Recruiter Registration</h1>
        <p class="register-subtitle">
            Create your recruiter account to post and manage jobs.
        </p>

        <form id="recruiter-register-form" onsubmit="registerRecruiter(event)">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                >
            </div>

            <button type="submit" class="register-btn">
                Register as Recruiter
            </button>

        </form>

        <p id="recruiter-register-message"></p>

    </div>

</section>

<footer>
    <p>&copy; 2026 HireFlow. All rights reserved.</p>
</footer>

<script src="session.js"></script>
<script src="script.js"></script>

</body>
</html>
